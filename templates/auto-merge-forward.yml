# ============================================================================
# Merges a release branch (e.g., 'release/1.0') to the default branch
# (e.g., 'main')
spec:
  inputs:

    # ------------------------------------------------------------------------
    stage:
      description:  The stage for the this Job
      type: string
      default: release

    # ------------------------------------------------------------------------
    # These settings affect Job names for all Jobs instantiated by the component
    job_name_prefix:
      description: Optional prefix for the Job names
      type: string
      default: ''

    job_name_suffix:
      description: Optional suffix for the Job names
      type: string
      default: ''


  component:
    - name
    - version
    - reference


---


# ----------------------------------------------------------------------------
include:
  - local: templates/defaults.yml
  - local: .auto-merge-forward.gitlab-ci.yml


# ----------------------------------------------------------------------------
"$[[ inputs.job_name_prefix ]]merge forward$[[ inputs.job_name_suffix ]]":
  extends: .auto-merge-forward
  stage: $[[ inputs.stage ]]
  variables:
    COMPONENT_NAME: $[[ component.name ]]
    COMPONENT_REFERENCE: $[[ component.reference ]]
  rules:
    - !reference [.rules//if-release-branch, rules]
