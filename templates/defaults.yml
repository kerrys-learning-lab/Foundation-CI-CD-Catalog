# ============================================================================
variables:
  INSTALL_DIR: /usr/local/install
  PIPELINE_ARTIFACTS_DIR: .pipeline-artifacts
  RELEASE_NOTES_DIR: $PIPELINE_ARTIFACTS_DIR/release-notes
  JOB_ARTIFACTS_DIR: .job-artifacts/$CI_JOB_NAME_SLUG
  ROCKYLINUX_BASE_IMAGE: docker.io/rockylinux/rockylinux:10.2-ubi
  PUBLISH_MODE: ""
  RELEASE_MODE: ""
  PROJECT_GENERIC_PACKAGES_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic


# ============================================================================
stages:
  - build     # Produces one or more artifacts based on the Project's source code
              # Example actions: compile, package, containerize
  - test      # Tests the sofware artifacts (possibly includes secrity scans)
              # Example actions: unit test, security scan, quality gate
  - publish   # Push the artifact in an accessible repository
              # Example actions:  'podman push', 'npm publish'
  - verify    # Validate the published artifact against its down-stream
              # consumers, before it is released
              # Example actions:  trigger consumer Pipelines, contract test
  - release   # Notify down-stream consumers, update environment, etc.


# ============================================================================
default:
  interruptible: true
  before_script:
    - |
      # --- default (before) -------------------------------------------------
      set -e
      mkdir -p ${JOB_ARTIFACTS_DIR}
      mkdir -p ${PIPELINE_ARTIFACTS_DIR}

      BUILDER_OS=$(uname -s | tr '[:upper:]' '[:lower:]')
      BUILDER_ARCH=$(uname -m)

      case "${BUILDER_OS}" in
        linux*)               BUILDER_OS="linux"    ;;
        darwin*)              BUILDER_OS="darwin"   ;;
        msys*|cygwin*|mingw*) BUILDER_OS="windows"  ;;
      esac

      case "${BUILDER_ARCH}" in
        x86_64)   BUILDER_ARCH=amd64  ;;
        aarch64)  BUILDER_ARCH=arm64  ;;
      esac

      if [[ "${CICD_VERY_VERBOSE}" == "true" ]]; then
        set -x
      fi


# ============================================================================
.default-base:
  interruptible: true
  before_script:
    - !reference [default,  before_script]
  script:
    - |
      # --- default-base -----------------------------------------------------
      TABLE_ROWS=()

      if [[ -n "${COMPONENT_NAME}" && -n "${COMPONENT_REFERENCE}" ]]; then
        TABLE_ROWS+=("--------------------;--------------------")
        TABLE_ROWS+=("🏷️ Component name;${COMPONENT_NAME}")
        TABLE_ROWS+=("❄️ Component version;${COMPONENT_REFERENCE}")
        TABLE_ROWS+=("--------------------;--------------------")
      fi

      if [[ -n "${JOB_SETTINGS}" ]]; then
        TABLE_ROWS+=("${JOB_SETTINGS[@]}")
      fi
    - !reference [.print-table, script]


# ============================================================================
.glab-login:
  script:
    - |
      # --- glab-login -------------------------------------------------------
      export GLAB_CHECK_UPDATE=false
      export GLAB_SEND_TELEMETRY=false
      exportGLAB_SHOW_WHATS_NEW=false
      echo ${CICD_BOT_TOKEN} | glab auth login  --hostname ${CI_SERVER_HOST}  \
                                                --stdin


# ============================================================================
.git-login:
  script:
    - |
      # --- git-login -------------------------------------------------------
      git config --global user.email  "${CICD_BOT_EMAIL}"
      git config --global user.name   "${CICD_BOT_NAME}"
      git remote set-url origin "https://PRIVATE-TOKEN:${CICD_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"


# ============================================================================
.git-commit:
  script:
    - |
      # --- git-commit -------------------------------------------------------
      GIT_COMMIT_CLI_ARGS=()
      GIT_COMMIT_CLI_ARGS+=(--quiet)

      if [[ -n "${GIT_COMMIT_MESSAGES[@]}" ]]; then
        for msg in "${GIT_COMMIT_MESSAGES[@]}"; do
          GIT_COMMIT_CLI_ARGS+=(--message "${msg}")
        done
      else
        GIT_COMMIT_CLI_ARGS+=(--message "${GIT_COMMIT_MSG:-Automatic commit}")
      fi
      git commit "${GIT_COMMIT_CLI_ARGS[@]}"


# ============================================================================
.git-push:
  script:
    - |
      # --- git-push ---------------------------------------------------------
      echo "🚀 Pushing to ${CI_PROJECT_NAME} (${CI_COMMIT_BRANCH})"

      # Rebase-and-retry if necessary
      GIT_PUSH_ATTEMPTS=${GIT_PUSH_ATTEMPTS:-5}

      for (( attempt=1; attempt<=GIT_PUSH_ATTEMPTS; attempt++ )); do
        if git push --quiet origin ${CI_COMMIT_BRANCH}; then
          echo "✅ Pushed on attempt ${attempt}"
          exit 0
        else
          echo "🔁 Push rejected; rebasing and retrying (${attempt}/${GIT_PUSH_ATTEMPTS})"
          sleep $(( attempt * 3 ))
          git pull --quiet --rebase origin ${CI_COMMIT_BRANCH}
        fi
      done

      echo "❌ Error: Unable to push after ${GIT_PUSH_ATTEMPTS} attempts"
      exit 100


# ============================================================================
.git-commit-and-push:
  script:
    - !reference [.git-login,   script]
    - !reference [.git-commit,  script]
    - !reference [.git-push,    script]



# ============================================================================
# Enforce MRs as the primary mechanism for Pipeline execution, since MRs
# carry 'intent'
#
#   - MRs know their target branch, which unlocks target-aware versioning,
#     merged-results pipleines, and merge trains
#   - Conversely, branch pushes are context-free (don't specify a target)
#
# Therefore, pushes become secondary to MRs (but, a branch push without a MR
# can still be built using the Web UI or a schedule)
.rules//merge-request-as-primary-workflow:
  rules:
    # Favor MR Pipelines:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

    # Also allow Web UI and schedule
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

    # Tags and protected branches are built upon push
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"

    # De-duplication, for merges to protected branches
    # Filter in CI_PIPELINE_SOURCE so that triggered piplines aren't impacted
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never

    - when: never


# ============================================================================
.rules//branch-as-primary-workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always


# ============================================================================
# These rules enforce the nominal publish case:
#
#   - For branches and tags, publishing may be skipped or forced via a 'mode'
#     input (implies the Job MUST declare said input)
#   - Publishing only occurs for protected branches and tags (unless
#     overridden by 'mode')
#   - Publishing never occurs from an MR
.rules//publish:
  rules:
    - !reference [.rules//never-if-merge-request,   rules]
    - !reference [.rules//never-if-gitlab-ci-local, rules]
    - if: $PUBLISH_MODE == "skip"
      when: never
    - if: $PUBLISH_MODE == "force"
    - !reference [.rules//if-protected-ref,  rules]


# ============================================================================
# These rules enforce the nominal release case:
#
#   - By default, only release tags (vX.Y.Z) are released
#   - For release tags (vX.Y.Z), a release may be skipped via 'mode' (skip)
#   - For release branches (release/X.Y) or the default branch, releasing may
#     be forced via 'mode' (force)
#   - Releases never occurs from an MR
#
# NOTE: Some actions cannot be forced.  For example, GitLab only allows
#       its 'release' keyword to be used with a tag (never a branch)
.rules//release:
  rules:
    - if: $RELEASE_MODE == "skip"
      when: never
    - !reference [.rules//never-if-merge-request,   rules]
    - !reference [.rules//never-if-gitlab-ci-local, rules]
    - !reference [.rules//if-release-tag,           rules]
    - if: $RELEASE_MODE == "force" && $CI_COMMIT_BRANCH =~ /^release\/.*/
    - if: $RELEASE_MODE == "force" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# ============================================================================
.rules//if-default-branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


# ============================================================================
.rules//never-if-default-branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never


# ============================================================================
.rules//if-protected-ref:
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"


# ============================================================================
.rules//if-protected-tag:
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"


# ============================================================================
.rules//if-release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/


# ============================================================================
.rules//if-release-branch:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/


# ============================================================================
.rules//if-gitlab-ci:
  rules:
    - if: $GITLAB_CI == "true"


# ============================================================================
.rules//if-gitlab-ci-local:
  rules:
    - if: $GITLAB_CI != "true"


# ============================================================================
.rules//never-if-gitlab-ci-local:
  rules:
    - if: $GITLAB_CI != "true"
      when: never


# ============================================================================
.rules//never-if-merge-request:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never


# ============================================================================
.print-table:
  script:
    - |
      #
      # --- print-table ------------------------------------------------------
      if [[ -n "${TABLE_ROWS}" ]]; then
        # Emojis require a compatible locale:
        export LC_ALL=C.UTF-8

        echo "=========================================================================================================="
        printf '%s\n' "${TABLE_ROWS[@]}" | column --table  \
                                                  --separator ';' \
                                                  --output-separator ' | '  \
                                                  --table-columns Setting,Value
        echo "=========================================================================================================="
        echo ""
      fi
