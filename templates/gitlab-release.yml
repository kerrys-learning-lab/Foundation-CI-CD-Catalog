# ============================================================================
spec:


  component:
    - name
    - version
    - reference


---


# ============================================================================
include:
  - component: $CI_SERVER_FQDN/devsecops/cicd-catalog/foundation/defaults@$[[ component.reference ]]
  - local: .gitlab-release.gitlab-ci.yml


# ============================================================================
gitlab release:
  extends: .gitlab-release
  stage: release
  image: $CI_REGISTRY/devsecops/cicd-catalog/foundation/glab:$[[ component.reference ]]
  variables:
    COMPONENT_NAME: $[[ component.name ]]
    COMPONENT_REFERENCE: $[[ component.reference ]]
  rules:
    - !reference [.rules//if-release-tag, rules]
