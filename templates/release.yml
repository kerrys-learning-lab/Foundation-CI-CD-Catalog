# ============================================================================
spec:
  inputs:

    stage:
      description: Assigns the Pipeline stage for this Job
      type: string
      default: release

    job_name_prefix:
      description:  Optional prefix for the Job name
      type: string
      default: ''

    job_name_suffix:
      description:  Optional suffix for the Job name
      type: string
      default: ''


  component:
    - name
    - version
    - reference


---


# ============================================================================
include:
  - local: templates/defaults.yml
  - local: .release.gitlab-ci.yml


# ============================================================================
"$[[ inputs.job_name_prefix]]release$[[ inputs.job_name_suffix ]]":
  extends: .release
  stage: $[[ inputs.stage ]]
  variables:
    COMPONENT_NAME: $[[ component.name ]]
    COMPONENT_REFERENCE: $[[ component.reference ]]
  rules:
    - !reference [.rules//never-if-gitlab-ci-local, rules]
    - !reference [.rules//if-protected-tag,         rules]
