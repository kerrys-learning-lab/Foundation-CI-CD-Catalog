# ============================================================================
# Tags a release branch (e.g., 'release/1.0') using the next calculated patch
# number
spec:


  component:
    - name
    - version
    - reference


---


# ----------------------------------------------------------------------------
include:
  - component: $CI_SERVER_FQDN/devsecops/cicd-catalog/foundation/defaults@$[[ component.reference ]]
  - local: .auto-tag.gitlab-ci.yml


# ----------------------------------------------------------------------------
auto tag:
  extends: .auto-tag
  stage: release
  variables:
    COMPONENT_NAME: $[[ component.name ]]
    COMPONENT_REFERENCE: $[[ component.reference ]]
  rules:
    - !reference [.rules//never-if-gitlab-ci-local, rules]
    - !reference [.rules//if-release-branch,        rules]
